<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TURBO BGT">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>TURBO BGT</title>
<style>
:root{--bg:#070419;--p:#11082e;--p2:#1a0d45;--pink:#ff2ca8;--cyan:#2de7ff;--orange:#ff8b3d;--green:#57ffae;--red:#ff527c;--muted:#a9a2c5}
*{box-sizing:border-box}body{margin:0;color:#fff;background:radial-gradient(circle at 50% -10%,#321069,#070419 50%,#03020b);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(7,4,25,.88);backdrop-filter:blur(14px);padding:15px 15px 9px;border-bottom:1px solid #ffffff17}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:25px;letter-spacing:2px;text-shadow:0 0 12px var(--pink),0 0 22px var(--cyan)}.version{font-size:10px;color:var(--cyan)}button{font:inherit;color:inherit;cursor:pointer}.gear{background:none;border:0;font-size:24px}
main{max-width:800px;margin:auto;padding:13px 14px 110px}.hero,.card,.week{background:linear-gradient(145deg,rgba(25,12,58,.96),rgba(10,7,29,.96));border:1px solid #ffffff12;border-radius:20px;box-shadow:0 8px 28px #0005}.hero{padding:17px;margin-bottom:12px;border-color:#ff2ca84d}.cycle{font-size:12px;color:var(--cyan)}.heroMoney{font-size:38px;font-weight:950;margin:5px 0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:13px}.label{font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}.val{font-size:20px;font-weight:900;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px;font-weight:900}.week{padding:13px;margin:9px 0}.whead{display:flex;justify-content:space-between;gap:8px}.wtitle{font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}.bar{height:7px;background:#03020c;border-radius:99px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px}.bar i.badbar{background:linear-gradient(90deg,var(--orange),var(--red))}
.btn{border:1px solid #2de7ff55;background:#2de7ff12;border-radius:12px;padding:10px 12px;font-weight:800}.primary{border:0;background:linear-gradient(90deg,#ff2ca8,#7b3cff)}.danger{border-color:#ff527c88;color:#ff9bb1;background:#ff527c12}.small{font-size:11px;padding:7px 9px}
.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#070419e8;backdrop-filter:blur(16px);border-top:1px solid #ffffff13;display:flex;gap:8px}.bottom button{flex:1}
.modal{display:none;position:fixed;z-index:50;inset:0;background:#02010dcc;backdrop-filter:blur(9px);align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:93vh;overflow:auto;background:linear-gradient(#180d42,#08051e);border-top:1px solid #2de7ff55;border-radius:24px 24px 0 0;padding:17px 15px calc(25px + env(safe-area-inset-bottom));max-width:800px;margin:auto}.sheet h2{margin:0 0 12px}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select{width:100%;background:#070419;color:#fff;border:1px solid #ffffff18;border-radius:11px;padding:12px;font-size:16px}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:47vh;overflow:auto}.cat{background:#10082f;border:1px solid #ffffff14;border-radius:15px;text-align:left;padding:10px}.cat.sel{border-color:var(--pink);box-shadow:0 0 13px #ff2ca833}.emoji{font-size:25px}.catimg{width:78px;height:78px;object-fit:cover;border-radius:12px;display:block;margin-bottom:7px;box-shadow:0 0 14px #ff2ca822}.miniicon{width:28px;height:28px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:5px}.expense{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff12}.empty{text-align:center;padding:24px;color:var(--muted)}.toast{position:fixed;z-index:100;left:50%;bottom:90px;transform:translate(-50%,15px);background:#160d3c;border:1px solid var(--cyan);padding:10px 14px;border-radius:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
#lock{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 25%,#34106d,#070419 60%);display:flex;align-items:center;justify-content:center;padding:20px}.lockbox{width:min(410px,100%);text-align:center}.lockbox img{width:105px;border-radius:25px;box-shadow:0 0 35px #ff2ca844}.pin{text-align:center;font-size:24px;letter-spacing:7px}.hide{display:none!important}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(3,1fr)}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100%);border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<div id="lock"><div class="lockbox"><img src="./icon-192.png"><h1>TURBO BGT</h1><p id="lockInfo" class="muted">Ustaw PIN do lokalnego sejfu.</p><input id="pin" class="field pin" type="password" inputmode="numeric" maxlength="12" placeholder="••••"><div class="actions"><button id="unlock" class="btn primary">Otwórz</button></div><p class="muted">Dane są przechowywane lokalnie na tym urządzeniu. PIN-u nie da się odzyskać.</p></div></div>
<header><div class="top"><div><div class="logo">TURBO BGT</div><div class="version">v16 • FRESH BUILD • 24.09.2026</div></div><button id="settings" class="gear">⚙️</button></div></header>
<main id="main"></main>
<div class="bottom"><button id="income" class="btn primary">＋ Wpłata</button><button id="expense" class="btn primary">− Wydatek</button></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const CATS=[["Paliwo","paliwo"],["Zakupy","zakupy"],["Ubranie","ubranie"],["Samochód","samochod"],["Zegarki","zegarki"],["Amunicja","amunicja"],["Broń","bron"],["Gry na konsole","gry"],["RTV AGD","rtv"],["Elektronika","elektronika"],["Restauracje","restauracje"],["Jedzenie","jedzenie"],["Rower","rower"],["Usługi różne","uslugi"],["Leki / Lekarz","leki_lekarz"]];
const LANGS={pl:{income:"Wpłata",expense:"Wydatek",spend:"DO WYDANIA",save:"PULA OSZCZĘDNOŚCI",spent:"WYDANO",left:"POZOSTAŁO",weeks:"TYGODNIE",summary:"Podsumowanie",settings:"Ustawienia",salary:"Wynagrodzenie netto",target:"Cel oszczędności",fixed:"Koszty stałe",add:"Dodaj koszt",language:"Język",delete:"Usuń",zero:"Wyzeruj oszczędności",cycle:"Cykl",over:"⚠ OVER LIMIT",amount:"Kwota",date:"Data",cat:"Kategoria",desc:"Opis",saveBtn:"Zapisz",cancel:"Anuluj",budget:"Do budżetu bieżącego",savings:"Do puli oszczędności",where:"Gdzie dodać wpłatę?",no:"Brak wydatków",close:"Zamknij",data:"Dane",export:"Eksport",lock:"Zablokuj",clear:"Wyczyść dane",confirm:"Czy na pewno?",pin:"PIN",newpin:"Zmień PIN",month:"Bieżący cykl",deleteCycle:"Usuń bieżący cykl",ok:"OK"},
en:{income:"Income",expense:"Expense",spend:"SPENDABLE",save:"SAVINGS POOL",spent:"SPENT",left:"REMAINING",weeks:"WEEKS",summary:"Summary",settings:"Settings",salary:"Net salary",target:"Savings target",fixed:"Fixed costs",add:"Add cost",language:"Language",delete:"Delete",zero:"Zero savings",cycle:"Cycle",over:"⚠ OVER LIMIT",amount:"Amount",date:"Date",cat:"Category",desc:"Description",saveBtn:"Save",cancel:"Cancel",budget:"Current budget",savings:"Savings pool",where:"Where to add income?",no:"No expenses",close:"Close",data:"Data",export:"Export",lock:"Lock",clear:"Clear data",confirm:"Are you sure?",pin:"PIN",newpin:"Change PIN",month:"Current cycle",deleteCycle:"Delete current cycle",ok:"OK"}};
let lang=localStorage.getItem("turbo_lang")||"pl";let S={pin:"",savings:0,settings:{salary:0,target:0,fixed:[]},cycles:[]};let selected=0;
const t=k=>(LANGS[lang]||LANGS.pl)[k]||LANGS.pl[k]||k;
const money=n=>new Intl.NumberFormat(lang==="pl"?"pl-PL":"en-US",{style:"currency",currency:"PLN",maximumFractionDigits:2}).format(Number(n)||0);
const iso=d=>{d=new Date(d);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function cycleDates(d=new Date()){d=new Date(d);let start=new Date(d.getFullYear(),d.getMonth(),10);if(d<start)start=new Date(d.getFullYear(),d.getMonth()-1,10);let end=new Date(start.getFullYear(),start.getMonth()+1,10);return [iso(start),iso(end)]}
function weekList(start,end){let out=[],n=Math.ceil((new Date(end)-new Date(start))/86400000/7);for(let i=0;i<n;i++){let a=new Date(start+"T00:00:00");a.setDate(a.getDate()+i*7);let b=new Date(a);b.setDate(b.getDate()+7);if(b>new Date(end+"T00:00:00"))b=new Date(end+"T00:00:00");out.push({n:i+1,a:iso(a),b:iso(b)});}return out}
function current(){let [a,b]=cycleDates();let c=S.cycles.find(x=>x.start===a);if(!c){c={id:a,start:a,end:b,salary:S.settings.salary,target:S.settings.target,fixed:S.settings.fixed.reduce((z,x)=>z+Number(x.amount),0),carry:0,income:[],expenses:[]};S.cycles.push(c)}return c}
function spendable(c){return Number(c.salary)+Number(c.carry||0)+c.income.filter(x=>x.budget).reduce((a,x)=>a+x.amount,0)-Number(c.target)-Number(c.fixed)}
function render(){let c=current(),total=spendable(c),used=c.expenses.reduce((a,x)=>a+x.amount,0),remain=total-used,ws=weekList(c.start,c.end),base=ws.length?total/ws.length:0;let rows=ws.map(w=>{let used=w.a<=c.end?c.expenses.filter(e=>e.date>=w.a&&e.date<w.b).reduce((a,x)=>a+x.amount,0):0;return {...w,budget:base,used,over:Math.max(0,used-base)}});document.getElementById("main").innerHTML=`<section class="hero"><div class="cycle">${t("cycle")}: ${c.start} → ${c.end}</div><div class="heroMoney">${money(remain)}</div><div class="muted">${t("spend")}</div></section><div class="grid"><div class="card"><div class="label">${t("spend")}</div><div class="val">${money(total)}</div></div><div class="card"><div class="label">${t("save")}</div><div class="val">${money(S.savings)}</div></div><div class="card"><div class="label">${t("spent")}</div><div class="val">${money(used)}</div></div><div class="card"><div class="label">${t("left")}</div><div class="val">${money(remain)}</div></div></div><div class="section">${t("weeks")}<button class="btn small" onclick="summary()">📊 ${t("summary")}</button></div>${rows.map(w=>`<div class="week"><div class="whead"><div class="wtitle">${t("weeks").slice(0,-1)} ${w.n}<div class="muted">${w.a} → ${w.b}</div></div><div class="${w.over?"bad":"ok"}">${w.over?t("over")+" "+money(w.over):"✓ "+money(Math.max(0,w.budget-w.used))}</div></div><div class="bar"><i class="${w.over?"badbar":""}" style="width:${w.budget?Math.min(100,w.used/w.budget*100):0}%"></i></div><div class="muted">${money(w.used)} / ${money(w.budget)}</div></div>`).join("")}<div class="section">${t("spent")}</div><div class="card">${c.expenses.length?c.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="expense"><div><b>${e.icon} ${e.cat}</b><div class="muted">${e.date}${e.desc?" • "+esc(e.desc):""}</div></div><div><b>${money(e.amount)}</b><button class="btn small danger" onclick="delExp('${e.id}')">✕</button></div></div>`).join(""):`<div class="empty">${t("no")}</div>`}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function save(){localStorage.setItem("turbo_state_v16",JSON.stringify(S))}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700)}
function modal(x){document.getElementById("sheet").innerHTML=x;document.getElementById("modal").classList.add("open")}
function close(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")close()}
function expense(){selected=0;modal(`<h2>${t("expense")}</h2><div class="field"><label>${t("amount")}</label><input id="ea" type="number" step=".01" inputmode="decimal"></div><div class="field"><label>${t("date")}</label><input id="ed" type="date" value="${iso(new Date())}"></div><div class="section">${t("cat")}</div><div class="cats">${CATS.map((c,i)=>`<button class="cat ${i===0?"sel":""}" onclick="pick(${i})"><img class="catimg" src="./icons/${c[1]}.png" alt=""><b>${c[0]}</b></button>`).join("")}</div><div class="field"><label>${t("desc")}</label><input id="exd"></div><div class="actions"><button class="btn" onclick="close()">${t("cancel")}</button><button class="btn primary" onclick="addExp()">${t("saveBtn")}</button></div>`)}
function pick(i){selected=i;document.querySelectorAll(".cat").forEach((x,j)=>x.classList.toggle("sel",i===j))}
function addExp(){let a=+document.getElementById("ea").value,d=document.getElementById("ed").value,c=current();if(!(a>0)||!d)return toast("Podaj kwotę i datę");if(d<c.start||d>c.end)return toast("Data poza cyklem");c.expenses.push({id:Date.now()+"",amount:a,date:d,cat:CATS[selected][0],icon:CATS[selected][1],desc:document.getElementById("exd").value});save();close();render()}
function delExp(id){if(!confirm(t("confirm")))return;let c=current();c.expenses=c.expenses.filter(x=>x.id!==id);save();render()}
function income(){modal(`<h2>${t("income")}</h2><div class="field"><label>${t("amount")}</label><input id="ia" type="number" step=".01" inputmode="decimal"></div><div class="field"><label>${t("where")}</label><select id="iw"><option value="b">${t("budget")}</option><option value="s">${t("savings")}</option></select></div><div class="actions"><button class="btn" onclick="close()">${t("cancel")}</button><button class="btn primary" onclick="addIncome()">${t("saveBtn")}</button></div>`)}
function addIncome(){let a=+document.getElementById("ia").value;if(!(a>0))return;let c=current();if(document.getElementById("iw").value==="s")S.savings+=a;else c.income.push({amount:a,budget:true});save();close();render()}
function settings(){let c=current();modal(`<h2>⚙️ ${t("settings")}</h2><div class="field"><label>${t("salary")}</label><input id="ss" type="number" step=".01" value="${c.salary}"></div><div class="field"><label>${t("target")}</label><input id="st" type="number" step=".01" value="${c.target}"></div><div class="section">${t("fixed")}<button class="btn small" onclick="addFixed()">＋</button></div><div>${S.settings.fixed.map((x,i)=>`<div class="expense"><span>${esc(x.name)}</span><span>${money(x.amount)} <button class="btn small danger" onclick="removeFixed(${i})">✕</button></span></div>`).join("")||"<div class='muted'>—</div>"}</div><div class="section">${t("language")}</div><select id="ll"><option value="pl">🇵🇱 Polski</option><option value="en">🇬🇧 English</option><option value="cs">🇨🇿 Čeština</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="pt">🇵🇹 Português</option><option value="sv">🇸🇪 Svenska</option><option value="no">🇳🇴 Norsk</option><option value="da">🇩🇰 Dansk</option><option value="nl">🇳🇱 Nederlands</option><option value="csb">🏴 Kaszëbsczi</option></select><div class="actions"><button class="btn" onclick="close()">${t("cancel")}</button><button class="btn primary" onclick="saveSettings()">${t("saveBtn")}</button></div><div class="actions"><button class="btn" onclick="zero()">${t("zero")}</button><button class="btn danger" onclick="deleteCycle()">${t("deleteCycle")}</button></div><div class="section">${t("data")}</div><div class="actions"><button class="btn" onclick="exportData()">${t("export")}</button><button class="btn" onclick="lock()">🔒 ${t("lock")}</button></div><div class="actions"><button class="btn danger" onclick="clearAll()">${t("clear")}</button></div>`);document.getElementById("ll").value=lang}
function addFixed(){let n=prompt(t("fixed"));if(!n)return;let a=+prompt(t("amount"));if(!(a>=0))return;S.settings.fixed.push({name:n,amount:a});save();settings()}
function removeFixed(i){S.settings.fixed.splice(i,1);save();settings()}
function saveSettings(){let c=current();c.salary=+document.getElementById("ss").value||0;c.target=+document.getElementById("st").value||0;S.settings.salary=c.salary;S.settings.target=c.target;c.fixed=S.settings.fixed.reduce((a,x)=>a+x.amount,0);lang=document.getElementById("ll").value;localStorage.setItem("turbo_lang",lang);save();close();render()}
function zero(){if(confirm(t("confirm"))){S.savings=0;save();settings()}}
function deleteCycle(){if(confirm(t("confirm"))){let c=current();S.cycles=S.cycles.filter(x=>x.id!==c.id);save();current();close();render()}}
function summary(){let c=current();let by=CATS.map(x=>[x[0],x[1],c.expenses.filter(e=>e.cat===x[0]).reduce((a,e)=>a+e.amount,0)]).filter(x=>x[2]>0);modal(`<h2>📊 ${t("summary")}</h2>${by.map(x=>`<div class="expense"><span>${x[1]} ${x[0]}</span><b>${money(x[2])}</b></div>`).join("")||"<div class='empty'>—</div>}<div class="actions"><button class="btn primary" onclick="close()">${t("close")}</button></div>`)}
function exportData(){let b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="TURBO_BGT_backup.json";a.click()}
function clearAll(){if(confirm(t("confirm"))){localStorage.removeItem("turbo_state_v16");location.reload()}}
function lock(){close();document.getElementById("lock").classList.remove("hide");document.getElementById("pin").value=""}
function hash(p){let h=7;for(let i=0;i<p.length;i++)h=Math.imul(31,h)+p.charCodeAt(i)|0;return String(h)}
function unlock(){let p=document.getElementById("pin").value;if(!S.pin){if(p.length<4)return toast("PIN min. 4 cyfry");S.pin=hash(p);save();document.getElementById("lock").classList.add("hide");render();return}if(hash(p)!==S.pin)return toast("Nieprawidłowy PIN");document.getElementById("lock").classList.add("hide");render()}
try{let x=JSON.parse(localStorage.getItem("turbo_state_v16")||"null");if(x)S=x}catch(e){}current();document.getElementById("income").onclick=income;document.getElementById("expense").onclick=expense;document.getElementById("settings").onclick=settings;document.getElementById("unlock").onclick=unlock;document.getElementById("pin").onkeydown=e=>{if(e.key==="Enter")unlock()};if(S.pin)document.getElementById("lockInfo").textContent="Wpisz PIN, aby otworzyć sejf.";render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
